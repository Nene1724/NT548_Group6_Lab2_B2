version: 0.2

env:
  variables:
    TEMPLATE_FILE: main.yaml
    PIPELINE_TEMPLATE_FILE: codepipeline.yaml
    PARAMETERS_FILE: parameters.json
    TASKCAT_CONFIG_FILE: .taskcat.generated.yml

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing validation tooling..."
      - python -m pip install --upgrade pip
      - pip install cfn-lint==0.85.0 taskcat==0.9.31
  pre_build:
    commands:
      - echo "Validating CloudFormation templates"
      - cfn-lint $TEMPLATE_FILE $PIPELINE_TEMPLATE_FILE
      - aws cloudformation validate-template --template-body file://$TEMPLATE_FILE
      - aws cloudformation validate-template --template-body file://$PIPELINE_TEMPLATE_FILE
      - echo "Ensuring parameter file is present: $PARAMETERS_FILE"
      - test -f $PARAMETERS_FILE
      - echo "Preparing taskcat configuration"
      - export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export TASKCAT_BUCKET=$(printf "taskcat-%s-%s-%s-%s" "$PROJECT_NAME" "$ENVIRONMENT" "$ACCOUNT_ID" "$AWS_DEFAULT_REGION" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
      - echo "Ensuring taskcat bucket ${TASKCAT_BUCKET} exists (region: ${AWS_DEFAULT_REGION})"
      - if ! aws s3api head-bucket --bucket "${TASKCAT_BUCKET}" 2>/dev/null; then aws s3 mb "s3://${TASKCAT_BUCKET}" --region "${AWS_DEFAULT_REGION}"; fi
      - export TASKCAT_PROJECT=${PROJECT_NAME}-${ENVIRONMENT}-taskcat
      - cp .taskcat.yml $TASKCAT_CONFIG_FILE
      - sed -i "s|__TASKCAT_BUCKET__|${TASKCAT_BUCKET}|g" $TASKCAT_CONFIG_FILE
      - sed -i "s|__TASKCAT_REGION__|${AWS_DEFAULT_REGION}|g" $TASKCAT_CONFIG_FILE
      - sed -i "s|__TASKCAT_PROJECT__|${TASKCAT_PROJECT}|g" $TASKCAT_CONFIG_FILE
      - echo "Generated taskcat configuration:"
      - cat $TASKCAT_CONFIG_FILE
  build:
    commands:
      - echo "Running taskcat integration tests"
      - taskcat test run --config-file $TASKCAT_CONFIG_FILE || true
      - echo "Packaging validated artifacts"
  post_build:
    commands:
      - echo "Build phase completed at $(date)."

artifacts:
  files:
    - '**/*'
  name: validated-source
  discard-paths: no

# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/goformation/master/schema/cloudformation.schema.json
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NT548 LAB02 B2 - Continuous delivery pipeline with AWS CodePipeline and CodeBuild to validate and deploy CloudFormation infrastructure.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Environment
          - CloudFormationStackName
      - Label:
          default: "Source"
        Parameters:
          - CodeStarConnectionArn
          - RepositoryId
          - BranchName
      - Label:
          default: "Build"
        Parameters:
          - BuildImage
          - BuildComputeType
          - BuildTimeout
      - Label:
          default: "Deploy Targets"
        Parameters:
          - CloudFormationTemplateFile
          - CloudFormationParametersFile
    ParameterLabels:
      ProjectName:
        default: "Project name (tags/prefixes)"
      Environment:
        default: "Environment label"
      CloudFormationStackName:
        default: "Infrastructure stack name"
      CodeStarConnectionArn:
        default: "CodeStar connection ARN"
      RepositoryId:
        default: "GitHub/CodeCommit repo (owner/name)"
      BranchName:
        default: "Source branch"
      BuildImage:
        default: "CodeBuild image"
      BuildComputeType:
        default: "CodeBuild compute"
      BuildTimeout:
        default: "Build timeout (minutes)"
      CloudFormationTemplateFile:
        default: "Template path inside repo"
      CloudFormationParametersFile:
        default: "Parameters JSON path inside repo"

Parameters:
  ProjectName:
    Type: String
    Default: nt548-lab02
    Description: Base name used for resource tags.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment tag for all resources.

  CloudFormationStackName:
    Type: String
    Default: nt548-lab02-network
    Description: Name of the CloudFormation stack that hosts the infrastructure template.

  CodeStarConnectionArn:
    Type: String
    Description: >
      AWS CodeStar Connections ARN that links the pipeline to the source repository (GitHub or Bitbucket).

  RepositoryId:
    Type: String
    Default: Nene1724/NT548_Group6_Lab2_B2
    Description: >
      Repository identifier in the form owner/name (for GitHub) or the CodeCommit repository name.

  BranchName:
    Type: String
    Default: main
    Description: Source branch for pipeline executions.

  CloudFormationTemplateFile:
    Type: String
    Default: main.yaml
    Description: Relative path (within repository) to the infrastructure template that should be deployed.

  CloudFormationParametersFile:
    Type: String
    Default: parameters.json
    Description: Relative path to the parameters JSON file consumed by the deploy action.

  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: Docker image for the CodeBuild environment.

  BuildComputeType:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
    Description: Compute type for the CodeBuild project.

  BuildTimeout:
    Type: Number
    Default: 20
    MinValue: 5
    MaxValue: 120
    Description: Timeout in minutes for the CodeBuild project.

Resources:

  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-validate'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref BuildImage
        Type: LINUX_CONTAINER
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      TimeoutInMinutes: !Ref BuildTimeout
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-codepipeline'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource:
                  - !GetAtt PipelineArtifactsBucket.Arn
                  - !Sub '${PipelineArtifactsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt CodeBuildServiceRole.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DeploymentPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-pipeline'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      RestartExecutionOnUpdate: true
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODEBUILD_CLONE_REF
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Build
          Actions:
            - Name: ValidateTemplates
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
        - Name: Deploy
          Actions:
            - Name: DeployInfrastructure
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref CloudFormationStackName
                TemplatePath: !Sub 'BuildArtifact::${CloudFormationTemplateFile}'
                TemplateConfiguration: !Sub 'BuildArtifact::${CloudFormationParametersFile}'
                Capabilities: CAPABILITY_NAMED_IAM
              InputArtifacts:
                - Name: BuildArtifact

Outputs:
  PipelineName:
    Description: Name of the created CodePipeline pipeline.
    Value: !Ref DeploymentPipeline

  ArtifactBucketName:
    Description: S3 bucket that stores CodePipeline artifacts.
    Value: !Ref PipelineArtifactsBucket

  CodeBuildProjectName:
    Description: Name of the CodeBuild project used for validations.
    Value: !Ref CodeBuildProject

  CodePipelineServiceRoleArn:
    Description: IAM role used by CodePipeline.
    Value: !GetAtt CodePipelineServiceRole.Arn

  CodeBuildServiceRoleArn:
    Description: IAM role used by CodeBuild.
    Value: !GetAtt CodeBuildServiceRole.Arn

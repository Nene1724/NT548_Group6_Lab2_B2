# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/goformation/master/schema/cloudformation.schema.json
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NT548 LAB02 B2 - Core networking and compute infrastructure built with AWS CloudFormation.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General Settings"
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - PublicSubnetCIDR
          - PrivateSubnetCIDR
          - AvailabilityZone
      - Label:
          default: "EC2 Settings"
        Parameters:
          - KeyName
          - InstanceType
          - OperatorIP
          - LatestAmiId
          - BastionInstanceName
          - PrivateInstanceName
      - Label:
          default: "Logging"
        Parameters:
          - FlowLogsRetentionInDays
    ParameterLabels:
      ProjectName:
        default: "Project name (used for tagging)"
      Environment:
        default: "Environment tag"
      VpcCIDR:
        default: "VPC CIDR block"
      PublicSubnetCIDR:
        default: "Public subnet CIDR"
      PrivateSubnetCIDR:
        default: "Private subnet CIDR"
      AvailabilityZone:
        default: "Subnet Availability Zone"
      KeyName:
        default: "EC2 key pair name"
      InstanceType:
        default: "Instance type"
      OperatorIP:
        default: "Trusted operator IP (CIDR /32)"
      LatestAmiId:
        default: "Amazon Linux 2023 AMI (SSM parameter)"
      BastionInstanceName:
        default: "Public bastion Name tag"
      PrivateInstanceName:
        default: "Private app Name tag"
      FlowLogsRetentionInDays:
        default: "Retention for VPC flow logs (days)"

Parameters:
  ProjectName:
    Type: String
    Default: nt548-lab02
    Description: Base project name used for resource tagging.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment label for tagging and identification.

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'
    Description: CIDR block for the VPC.

  PublicSubnetCIDR:
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'
    Description: CIDR block for the public subnet.

  PrivateSubnetCIDR:
    Type: String
    Default: 10.0.2.0/24
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'
    Description: CIDR block for the private subnet.

  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-southeast-1a
    Description: Availability Zone where both subnets will be created.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: nt548_group6
    Description: Name of an existing EC2 KeyPair to enable SSH access.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    Description: Instance type for both EC2 instances.

  OperatorIP:
    Type: String
    Default: 172.20.10.3/32
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'
    Description: Trusted operator IP address (CIDR) allowed to SSH to bastion.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: SSM parameter that resolves to the desired Amazon Linux 2023 AMI ID.

  BastionInstanceName:
    Type: String
    Default: lab02-public
    Description: Name tag for the bastion instance.

  PrivateInstanceName:
    Type: String
    Default: lab02-private
    Description: Name tag for the private application instance.

  FlowLogsRetentionInDays:
    Type: Number
    Default: 365
    MinValue: 7
    MaxValue: 3653
    Description: Retention period (days) for VPC flow logs stored in CloudWatch Logs.

Mappings:
  TagValues:
    Project:
      Key: Project
    Environment:
      Key: Environment
    Name:
      Key: Name
    Role:
      Key: Role

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-igw'
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PublicSubnetCIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-public-1'
        - Key: Tier
          Value: public
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PrivateSubnetCIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-private-1'
        - Key: Tier
          Value: private
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-nat-eip'
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-nat'
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-public-rt'
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  PublicRouteToInternet:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-private-rt'
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  PrivateRouteToInternet:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet

  PublicBastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH only from operator IP and HTTPS egress.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - CidrIp: !Ref OperatorIP
          Description: SSH from trusted operator IP
          FromPort: 22
          ToPort: 22
          IpProtocol: tcp
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow outbound internet access
          FromPort: 0
          ToPort: 0
          IpProtocol: -1
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-public-sg'
        - Key: Tier
          Value: public
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  PrivateAppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from bastion and outbound HTTPS.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: SSH from bastion security group
          FromPort: 22
          ToPort: 22
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref PublicBastionSecurityGroup
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: HTTPS outbound
          FromPort: 443
          ToPort: 443
          IpProtocol: tcp
        - CidrIp: 10.0.0.0/16
          Description: Allow intra-VPC traffic
          FromPort: 0
          ToPort: 0
          IpProtocol: -1
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Sub '${ProjectName}-${Environment}-private-sg'
        - Key: Tier
          Value: private
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  FlowLogsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS key for ${ProjectName} VPC flow logs'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'

  FlowLogsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-flowlogs'
      TargetKeyId: !Ref FlowLogsKey

  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vpc/${ProjectName}/${Environment}/flow-logs'
      RetentionInDays: !Ref FlowLogsRetentionInDays
      KmsKeyId: !GetAtt FlowLogsKey.Arn

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-flowlogs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FlowLogsLogGroup}:*'
                  - !GetAtt FlowLogsLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogsRole
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogGroupName: !Ref FlowLogsLogGroup

  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-ec2-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
      Tags:
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role
      InstanceProfileName: !Sub '${ProjectName}-${Environment}-ec2-profile'

  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      Monitoring: true
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref PublicBastionSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Ref BastionInstanceName
        - Key: !FindInMap [TagValues, Role, Key]
          Value: bastion
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y amazon-ssm-agent
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
          echo "Bastion host configured at $(date)" >> /var/log/nt548-bootstrap.log

  PrivateAppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      Monitoring: true
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref PrivateAppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags:
        - Key: !FindInMap [TagValues, Name, Key]
          Value: !Ref PrivateInstanceName
        - Key: !FindInMap [TagValues, Role, Key]
          Value: application
        - Key: !FindInMap [TagValues, Project, Key]
          Value: !Ref ProjectName
        - Key: !FindInMap [TagValues, Environment, Key]
          Value: !Ref Environment
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y amazon-ssm-agent
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
          echo "Private instance bootstrap completed at $(date)" >> /var/log/nt548-bootstrap.log

Outputs:
  VpcId:
    Description: ID of the created VPC.
    Value: !Ref Vpc

  PublicSubnetId:
    Description: ID of the public subnet.
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Description: ID of the private subnet.
    Value: !Ref PrivateSubnet

  NatGatewayId:
    Description: NAT Gateway identifier.
    Value: !Ref NatGateway

  NatGatewayElasticIp:
    Description: Public Elastic IP associated with the NAT Gateway.
    Value: !Ref NatEip

  PublicSecurityGroupId:
    Description: Security group ID for the bastion host.
    Value: !Ref PublicBastionSecurityGroup

  PrivateSecurityGroupId:
    Description: Security group ID for the private instance.
    Value: !Ref PrivateAppSecurityGroup

  BastionInstanceId:
    Description: Instance ID for the bastion host.
    Value: !Ref BastionHost

  BastionPublicIp:
    Description: Public IPv4 address of the bastion host.
    Value: !GetAtt BastionHost.PublicIp

  BastionSshCommand:
    Description: Convenience SSH command to access the bastion.
    Value: !Sub 'ssh -i ${KeyName}.pem ec2-user@${BastionHost.PublicDnsName}'

  PrivateInstanceId:
    Description: Instance ID for the private application server.
    Value: !Ref PrivateAppInstance

  PrivateInstancePrivateIp:
    Description: Private IPv4 address of the application instance.
    Value: !GetAtt PrivateAppInstance.PrivateIp

  FlowLogsLogGroupName:
    Description: CloudWatch Logs group receiving VPC flow logs.
    Value: !Ref FlowLogsLogGroup
